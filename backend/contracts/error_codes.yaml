# 错误码唯一注册表（人工维护）。
# 任何改动都必须同步 backend/framework/error/error_code.cpp 的 k_registry，
# 并由 framework_error_contract CTest 用例校验一致。
errors:
  - code: SYSTEM.OK
    httpStatus: 200
    defaultMessage: 成功
    owner: platform
    category: system
    retryable: false
    exposable: true
    deprecated: false
  - code: REQUEST.INVALID_ARGUMENT
    httpStatus: 400
    defaultMessage: 请求参数不合法
    owner: platform
    category: request
    retryable: false
    exposable: true
    deprecated: false
  - code: ALGORITHM.NOT_SUPPORTED
    httpStatus: 404
    defaultMessage: 请求的算法不在支持清单内
    owner: platform
    category: algorithm
    retryable: false
    exposable: true
    deprecated: false
  - code: ALGORITHM.FAILED
    httpStatus: 422
    defaultMessage: 算法无法处理当前输入
    owner: platform
    category: algorithm
    retryable: false
    exposable: true
    deprecated: false
  - code: BAZI.CHART_UNAVAILABLE
    httpStatus: 503
    defaultMessage: 命盘暂不可用，请稍后重试
    owner: bazi
    category: dependency
    retryable: true
    exposable: true
    deprecated: false
  - code: ARCHIVE.NOT_FOUND
    httpStatus: 404
    defaultMessage: 快照不存在或已过期
    owner: platform
    category: request
    retryable: false
    exposable: true
    deprecated: false
  - code: DEPENDENCY.UNAVAILABLE
