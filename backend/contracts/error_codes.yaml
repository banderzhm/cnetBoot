# Canonical error-code contract. Keep it synchronized with k_registry in
# backend/framework/error/error_code.cpp; framework_error_contract verifies it.
errors:
  - code: SYSTEM.OK
    httpStatus: 200
    defaultMessage: Success
    owner: platform
    category: system
    retryable: false
    exposable: true
    deprecated: false
  - code: REQUEST.INVALID_ARGUMENT
    httpStatus: 400
    defaultMessage: Invalid request arguments
    owner: platform
    category: request
    retryable: false
    exposable: true
    deprecated: false
  - code: CHAT.CATEGORY_INVALID
    httpStatus: 400
    defaultMessage: Invalid chat category
    owner: chat
    category: request
    retryable: false
    exposable: true
    deprecated: false
  - code: AI.REQUEST_FAILED
    httpStatus: 422
    defaultMessage: AI could not process the request
    owner: ai
    category: dependency
    retryable: false
    exposable: true
    deprecated: false
  - code: DEPENDENCY.UNAVAILABLE
    httpStatus: 503
    defaultMessage: An upstream dependency is temporarily unavailable
    owner: platform
    category: dependency
    retryable: true
    exposable: true
    deprecated: false
  - code: AUTH.INVALID_CREDENTIALS
    httpStatus: 401
    defaultMessage: Invalid username or password
    owner: identity
    category: authentication
    retryable: false
    exposable: true
    deprecated: false
  - code: AUTH.TOKEN_MISSING
    httpStatus: 401
    defaultMessage: Access token is required
    owner: identity
    category: authentication
    retryable: false
    exposable: true
    deprecated: false
  - code: AUTH.TOKEN_INVALID
    httpStatus: 401
    defaultMessage: Access token is invalid
    owner: identity
    category: authentication
    retryable: false
    exposable: true
    deprecated: false
  - code: AUTH.TOKEN_EXPIRED
    httpStatus: 401
    defaultMessage: Access token has expired
    owner: identity
    category: authentication
    retryable: false
    exposable: true
    deprecated: false
  - code: AUTH.FORBIDDEN
    httpStatus: 403
    defaultMessage: Permission denied
    owner: identity
    category: authorization
    retryable: false
    exposable: true
    deprecated: false
  - code: AUTH.ACCOUNT_LOCKED
    httpStatus: 423
    defaultMessage: Account is temporarily locked
    owner: identity
    category: authentication
    retryable: true
    exposable: true
    deprecated: false
  - code: AUTH.ACCOUNT_DISABLED
    httpStatus: 403
    defaultMessage: Account is disabled
    owner: identity
    category: authentication
    retryable: false
    exposable: true
    deprecated: false
  - code: USER.NOT_FOUND
    httpStatus: 404
    defaultMessage: User not found
    owner: identity
    category: request
    retryable: false
    exposable: true
    deprecated: false
  - code: USER.CONFLICT
    httpStatus: 409
    defaultMessage: User already exists or has a conflicting state
    owner: identity
    category: request
    retryable: false
    exposable: true
    deprecated: false
  - code: ROLE.NOT_FOUND
    httpStatus: 404
    defaultMessage: Role not found
    owner: identity
    category: request
    retryable: false
    exposable: true
    deprecated: false
  - code: ROLE.CONFLICT
    httpStatus: 409
    defaultMessage: Role code already exists or has a conflicting state
    owner: identity
    category: request
    retryable: false
    exposable: true
    deprecated: false
  - code: PERMISSION.NOT_FOUND
    httpStatus: 404
    defaultMessage: Permission not found
    owner: identity
    category: request
    retryable: false
    exposable: true
    deprecated: false
  - code: SETTING.NOT_FOUND
    httpStatus: 404
    defaultMessage: Setting not found
    owner: identity
    category: request
    retryable: false
    exposable: true
    deprecated: false
  - code: REQUEST.METHOD_NOT_ALLOWED
    httpStatus: 405
    defaultMessage: Method not allowed for this resource
    owner: platform
    category: request
    retryable: false
    exposable: true
    deprecated: false
  - code: CHAT.SESSION_NOT_FOUND
    httpStatus: 404
    defaultMessage: Chat session not found
    owner: chat
    category: request
    retryable: false
    exposable: true
    deprecated: false
  - code: DEPARTMENT.NOT_FOUND
    httpStatus: 404
    defaultMessage: Department not found
    owner: identity
    category: request
    retryable: false
    exposable: true
    deprecated: false
  - code: DEPARTMENT.CONFLICT
    httpStatus: 409
    defaultMessage: Department has children or members, or its hierarchy conflicts
    owner: identity
    category: request
    retryable: false
    exposable: true
    deprecated: false
  - code: REQUEST.RATE_LIMITED
    httpStatus: 429
    defaultMessage: Too many requests
    owner: platform
    category: request
    retryable: true
