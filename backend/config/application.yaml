application:
  name: cnetnexus
  install_signal_handlers: true
  # 业务 HTTP 事件循环数；连接固定归属一个循环。连接池上限是全应用总量，按循环平摊，
  # 因此不得超过任一已启用连接池的 maximum_size（当前受 calculation-cache 的 4 限制）。
  io_threads: 1   # 可由 cnetmod 的 CNETMOD_IO_THREADS 环境层覆盖

crash_dump:
  directory: crash

logging:
  manage_lifecycle: true
  level: info
  format: json

http:
  address: 0.0.0.0
  port: 8080
  request_timeout_ms: 15000
  request_ids: true
  access_logging: true
  recover_exceptions: true

management:
  enabled: true
  address: 127.0.0.1
  port: 8081
  same_port: false

observability:
  tracing: true
  metrics: true
  logs: true
  sampling_ratio: 1.0

security:
  jwt:
    enabled: true
    issuer: cnetnexus
    secret: ${CNETNEXUS_JWT_SECRET}
    expires_in_seconds: 604800
    session_idle_seconds: 900

services:
  primary-database:
    type: mysql
    instance: primary
    enabled: true
    required: true
    host: 127.0.0.1
    port: 3306
    username: cnetnexus
    password: ${CNETNEXUS_DATABASE_PASSWORD}
    database: cnetnexus
    # cnetmod's MySQL auto-configurator accepts minimum_size / maximum_size;
    # "pool_size" is not a known key and makes application_builder::build()
    # fail with errc::invalid_argument before any listener starts.
    minimum_size: 1
    maximum_size: 8
    connect_timeout_ms: 5000
    pool_timeout_ms: 3000
  primary-cache:
    type: redis
    instance: primary
    enabled: true
    required: true
    host: 127.0.0.1
    port: 6379
    minimum_size: 1
    maximum_size: 8
    connect_timeout_ms: 1000
    pool_timeout_ms: 500
  calculation-cache:
    type: redis
    instance: calculation-cache
    enabled: true
    required: false
    host: 127.0.0.1
    port: 6379
    minimum_size: 0
    maximum_size: 4
    connect_timeout_ms: 500
    pool_timeout_ms: 100

platform:
  mapper_directory: mapper

chat:
  history_limit: 20
  token_budget: 8192
  system_prompt: ""
  provider: ""
  model: ""
  reasoning_effort: ""
  max_tokens: 1024

# LLM 供应商目录（reading_module 声明的 typed options）。providers 为空表示不启用
# LLM：解读/对话返回 DEPENDENCY.UNAVAILABLE，/api/v1/llm/providers 返回
# configured=false。多供应商 / 多 key 配置见 config/llm.providers.example.yaml。
llm:
  providers: []

# 入口层（platform_module 声明）：客户端识别与按路由声明的限流策略。
# 部署在反向代理之后时，把代理地址（或 CIDR）写进 trusted_proxies；否则所有请求都会
# 按代理地址计数。只有来自可信代理的 X-Forwarded-For 才会被采信。
edge:
  trusted_proxies: []
  rate_limits:
    login: {rate_per_second: 0.2, burst: 5}          # 登录：约每 5 秒 1 次，突发 5 次
    reading: {rate_per_second: 0.05, burst: 3}       # LLM 解读：约每 20 秒 1 次，突发 3 次
    archive_write: {rate_per_second: 0.2, burst: 5}  # 写存档

# 身份（identity_module 声明）：登录防爆破与授权快照缓存。
identity:
  login:
    max_account_failures: 5    # 同一账号窗口内失败次数上限（跨所有客户端）
    max_client_failures: 20    # 同一客户端地址窗口内失败次数上限（跨所有账号）
    window_seconds: 900
    lock_seconds: 900
  # 授权快照（角色 / 权限 / 数据范围）进程内缓存秒数；0 关闭。
  # 会话撤销（logout / refresh）每个请求都校验，立即生效；停用账号或调整角色最迟在此时长后生效。
  principal_cache_seconds: 30
