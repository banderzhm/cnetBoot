application:
  name: cnetboot
  install_signal_handlers: true
  # HTTP event-loop count. Each connection belongs to one loop, while connection-pool
  # limits are application-wide and distributed across loops.
  io_threads: 1   # CNETMOD_IO_THREADS may override this value.

crash_dump:
  directory: crash

logging:
  manage_lifecycle: true
  level: info
  format: json

http:
  address: 0.0.0.0
  port: 8080
  request_timeout_ms: 15000
  request_ids: true
  access_logging: true
  recover_exceptions: true

management:
  enabled: true
  address: 127.0.0.1
  port: 8081
  same_port: false

observability:
  tracing: true
  metrics: true
  logs: true
  sampling_ratio: 1.0

security:
  jwt:
    enabled: true
    issuer: cnetboot
    secret: ${CNETBOOT_JWT_SECRET}
    expires_in_seconds: 604800
    session_idle_seconds: 900

services:
  primary-database:
    type: mysql
    instance: primary
    enabled: true
    required: true
    host: 127.0.0.1
    port: 3306
    username: cnetboot
    password: ${CNETBOOT_DATABASE_PASSWORD}
    database: cnetboot
    # cnetmod's MySQL auto-configurator accepts minimum_size / maximum_size;
    # "pool_size" is not a known key and makes application_builder::build()
    # fail with errc::invalid_argument before any listener starts.
    minimum_size: 1
    maximum_size: 8
    connect_timeout_ms: 5000
    pool_timeout_ms: 3000
  primary-cache:
    type: redis
    instance: primary
    enabled: true
    required: true
    host: 127.0.0.1
    port: 6379
    minimum_size: 1
    maximum_size: 8
    connect_timeout_ms: 1000
    pool_timeout_ms: 500
platform:
  mapper_directory: mapper

chat:
  history_limit: 20
  token_budget: 8192
  system_prompt: ""
  provider: ""
  model: ""
  reasoning_effort: ""
  max_tokens: 1024

# LLM provider catalog declared explicitly by ai_module. An empty providers list disables
# LLM calls: chat returns DEPENDENCY.UNAVAILABLE and the catalog reports configured=false.
# See config/llm.providers.example.yaml for multi-provider and multi-key configuration.
llm:
  providers: []

# Edge settings owned by platform_module: client identification and route-specific limits.
# Add reverse-proxy addresses or CIDRs to trusted_proxies. X-Forwarded-For is accepted only
# from those proxies.
edge:
  trusted_proxies: []
  rate_limits:
    login: {rate_per_second: 0.2, burst: 5}
    ai: {rate_per_second: 0.05, burst: 3}

# Identity settings owned by identity_module.
identity:
  login:
    max_account_failures: 5    # Per-account failures within the window.
    max_client_failures: 20    # Per-client failures within the window.
    window_seconds: 900
    lock_seconds: 900
  # In-process authorization snapshot TTL. Zero disables the cache. Session revocation is
  # checked on every request; account and role changes propagate within this TTL.
  principal_cache_seconds: 30
