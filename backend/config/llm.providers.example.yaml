# Multi-provider, multi-model, multi-key LLM configuration example.
#
# This file is documentation and is not copied by CMake. Merge the service entries into
# application.yaml, replace its top-level llm section, and inject the environment variables.
#
# Rules:
# 1. One service entry represents one API key and one connection pool. pool_size controls
#    concurrency; it does not rotate keys. Aggregate multiple entries through providers[].keys[].
# 2. cnetBoot explicitly enables round-robin selection and cross-instance fallback. Retry order
#    and attempts are controlled by llm.resilience.
# 3. Inject every api_key through ${VAR} or ${VAR:-default}; never commit a plaintext key.
# 4. Disable entries without credentials. Disabled entries may have an empty api_key and are
#    exposed as configured=false in the catalog.
# 5. ai_module owns this typed section. Unknown keys, unreachable defaults, duplicate names or
#    models, and sharing one service across keys fail during Application construction.

services:
  # One provider service per key.
  openai-primary:
    type: openai
    instance: alpha
    enabled: ${CNETBOOT_LLM_ENABLED:-false}
    required: false
    base_url: https://api.openai.com/v1
    api_key: ${CNETBOOT_OPENAI_API_KEY:-}
    tls_verify: true
    timeout_seconds: 120
    pool_size: 4
  openai-secondary:
    type: openai
    instance: beta
    enabled: ${CNETBOOT_LLM_ENABLED:-false}
    required: false
    base_url: https://api.openai.com/v1
    api_key: ${CNETBOOT_OPENAI_API_KEY_SECONDARY:-}
    tls_verify: true
    timeout_seconds: 120
    pool_size: 2
  deepseek-primary:
    type: openai
    instance: deepseek
    enabled: ${CNETBOOT_LLM_ENABLED:-false}
    required: false
    base_url: https://api.deepseek.com/v1
    api_key: ${CNETBOOT_DEEPSEEK_API_KEY:-}
    tls_verify: true
    timeout_seconds: 120
    pool_size: 2

llm:
  default_provider: openai
  default_model: gpt-4o-mini
  providers:
    - name: openai
      type: openai
      models: [gpt-4o-mini, gpt-4o]
      keys:
        - name: primary
          service: openai-primary
        - name: secondary
          service: openai-secondary
    - name: deepseek
      type: openai
      models: [deepseek-chat]
      keys:
        - service: deepseek-primary
  resilience:
    attempts_per_key: 1
    initial_backoff_ms: 100
    max_backoff_ms: 2000
