name: Build and architecture gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnetboot-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout cnetBoot
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Install build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ninja-build liburing-dev
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23 all
          sudo apt-get install -y libc++-23-dev libc++abi-23-dev
          wget -q https://github.com/Kitware/CMake/releases/download/v4.1.2/cmake-4.1.2-linux-x86_64.sh
          chmod +x cmake-4.1.2-linux-x86_64.sh
          sudo ./cmake-4.1.2-linux-x86_64.sh --skip-license --prefix=/usr/local

      - name: Prebuild and install cnetmod
        shell: bash
        env:
          CNETBOOT_JOBS: 1
          CNETBOOT_FRESH: 1
          PATH: /usr/lib/llvm-23/bin:/usr/local/bin:/usr/bin:/bin
        run: ./script/wsl_clang_3rdparty_build.sh

      - name: Build cnetBoot and run mandatory gate
        shell: bash
        env:
          CNETBOOT_BUILD_TESTING: ON
          CNETBOOT_JOBS: 1
          PATH: /usr/lib/llvm-23/bin:/usr/local/bin:/usr/bin:/bin
        run: ./script/wsl_clang_build.sh

      - name: Run tests
        shell: bash
        run: ctest --test-dir backend/build-clang --output-on-failure -j2

  windows-msvc:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout cnetBoot
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Install CMake 4.1
        shell: pwsh
        run: |
          $version = '4.1.2'
          $archive = Join-Path $env:RUNNER_TEMP "cmake-$version-windows-x86_64.zip"
          $tools = Join-Path $env:RUNNER_TEMP 'cnetboot-tools'
          Invoke-WebRequest `
            -Uri "https://github.com/Kitware/CMake/releases/download/v$version/cmake-$version-windows-x86_64.zip" `
            -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          $bin = Join-Path $tools "cmake-$version-windows-x86_64/bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prebuild and install cnetmod
        shell: pwsh
        run: .\script\windows_3rdparty_build.ps1 -Fresh -Jobs 1

      - name: Build cnetBoot and run mandatory gate
        shell: pwsh
        run: .\script\windows_build.ps1 -BuildTests -Fresh -Jobs 1

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir backend/build-windows --output-on-failure -j2
