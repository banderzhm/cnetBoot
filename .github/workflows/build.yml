name: Build and architecture gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnetboot-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-clang:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout cnetBoot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Install build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ninja-build libicu-dev liburing-dev
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all
          sudo apt-get install -y libc++-22-dev libc++abi-22-dev
          wget -q https://github.com/Kitware/CMake/releases/download/v4.1.2/cmake-4.1.2-linux-x86_64.sh
          chmod +x cmake-4.1.2-linux-x86_64.sh
          sudo ./cmake-4.1.2-linux-x86_64.sh --skip-license --prefix=/usr/local

      - name: Prebuild and install cnetmod
        shell: bash
        env:
          CNETBOOT_JOBS: 1
          PATH: /usr/lib/llvm-22/bin:/usr/local/bin:/usr/bin:/bin
        run: ./script/wsl_clang_3rdparty_build.sh

      - name: Build cnetBoot and run mandatory gate
        shell: bash
        env:
          CNETBOOT_BUILD_TESTING: ON
          CNETBOOT_JOBS: 1
          PATH: /usr/lib/llvm-22/bin:/usr/local/bin:/usr/bin:/bin
        run: ./script/wsl_clang_build.sh

      - name: Run tests
        shell: bash
        run: ctest --test-dir backend/build-clang --output-on-failure -j2
